[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surplus-agent"
version = "0.1.0"
description = "Claude-powered agent for public-record surplus funds recovery (FL, TX, GA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
surplus = "surplus.cli:main"

[tool.setuptools]
packages = ["surplus"]

[tool.setuptools.package-data]
surplus = ["statutes/*.json", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
